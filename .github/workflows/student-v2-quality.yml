name: Student v2 Quality

on:
  pull_request:
    paths:
      - 'student-app-v2/**'
      - 'student-core/**'
      - 'packages/api-contract/**'
      - '.github/workflows/student-v2-quality.yml'
  push:
    branches: [develop, main]
    paths:
      - 'student-app-v2/**'
      - 'student-core/**'
      - 'packages/api-contract/**'
      - '.github/workflows/student-v2-quality.yml'

permissions:
  contents: read

jobs:
  student-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-app-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: student-app-v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:a11y
      - run: npm run build
