name: Phase 1 Graph Bootstrap

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  bootstrap-graph:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'architecture/complete-phase-1-graph-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Graphify
        run: python -m pip install --disable-pip-version-check 'graphifyy==0.9.58'

      - name: Build fresh code graph and report
        run: |
          rm -rf graphify-out
          graphify extract . --code-only --no-viz
          test -s graphify-out/graph.json
          graphify cluster-only . --no-viz --no-label
          test -s graphify-out/GRAPH_REPORT.md
          graphify query 'authentication persistence authorization notifications student plan exam report module dependencies' --graph graphify-out/graph.json --budget 1200 > graphify-out/phase1-query.txt

      - name: Record generation metadata
        shell: bash
        run: |
          {
            echo '# Graphify generation metadata'
            echo
            echo "- Graphify: $(graphify --version)"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo '- Mode: code-only clean rebuild + deterministic clustering/report; no visualization'
            echo '- Purpose: Phase 1 source dependency validation'
          } > graphify-out/GENERATION.md

      - name: Commit generated graph
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/phase1-query.txt graphify-out/GENERATION.md
          if git diff --cached --quiet; then
            echo 'Graph is already current.'
            exit 0
          fi
          git commit -m 'chore: generate current v2 Graphify graph'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
