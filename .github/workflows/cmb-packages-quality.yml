name: CMB Packages Quality

on:
  pull_request:
    paths: ['packages/cmb/**', 'apps/api/**', 'tooling/architecture/**', 'tooling/workspace/**', '.github/workflows/cmb-packages-quality.yml']
  push:
    branches: [develop, main]
    paths: ['packages/cmb/**', 'apps/api/**', 'tooling/architecture/**', 'tooling/workspace/**', '.github/workflows/cmb-packages-quality.yml']

permissions:
  contents: read

jobs:
  cmb-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install and test every CMB package
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/cmb/*; do
            test -f "$dir/package.json" || continue
            echo "==> $dir"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund && npm test)
          done
      - name: Enforce workspace and package boundaries
        run: |
          npm run workspace:check
          npm run architecture:check
          npm run contracts:check
