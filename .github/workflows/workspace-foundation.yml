name: Workspace Foundation

on:
  pull_request:
    branches: [develop]
    paths:
      - package.json
      - tooling/workspace/**
      - backend-v2/package.json
      - backend-v2/package-lock.json
      - admin-v2/package.json
      - admin-v2/package-lock.json
      - student-core/package.json
      - student-core/package-lock.json
      - student-app-v2/package.json
      - student-app-v2/package-lock.json
      - packages/api-contract/package.json
      - .github/workflows/workspace-foundation.yml
  push:
    branches: [develop]
    paths:
      - package.json
      - tooling/workspace/**
      - backend-v2/package.json
      - backend-v2/package-lock.json
      - admin-v2/package.json
      - admin-v2/package-lock.json
      - student-core/package.json
      - student-core/package-lock.json
      - student-app-v2/package.json
      - student-app-v2/package-lock.json
      - packages/api-contract/package.json
      - .github/workflows/workspace-foundation.yml

permissions:
  contents: read

jobs:
  validate-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Validate workspace graph
        run: npm run workspace:check
      - name: Show workspace order
        run: npm run workspace:list
      - name: Validate build plan
        run: npm run workspace:plan -- build
      - name: Dry-run repository verification
        run: node tooling/workspace/run.mjs verify --dry-run
