name: Backend v2 Quality

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/api-contract/**'
      - 'packages/cmb/**'
      - '.github/workflows/backend-v2-quality.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/api/**'
      - 'packages/api-contract/**'
      - 'packages/cmb/**'
      - '.github/workflows/backend-v2-quality.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
