services:
  backend-v2:
    build: .
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_TYPE: sqlite
      DATABASE_PATH: /data/moshaver-v2.sqlite
      CORS_ORIGINS: http://localhost:1420,http://127.0.0.1:1420,http://localhost:5173,http://127.0.0.1:5173,https://st.mahakaram.ir,https://admin.mahakaram.ir
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 30
    volumes:
      - sqlite-data:/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  sqlite-data:
