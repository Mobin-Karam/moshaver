services:
  backend-v2:
    build: ./backend-v2
    container_name: moshaver-backend-v2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_TYPE: sqlite
      DATABASE_PATH: /data/moshaver-v2.sqlite
      CORS_ORIGINS: http://localhost:1420,http://127.0.0.1:1420,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,https://st.mahakaram.ir,https://admin.mahakaram.ir
      COOKIE_SECURE: 0
      COOKIE_SAMESITE: lax
      SESSION_TTL_HOURS: 168
    command: sh -c "node dist/database/seeds/seed.js && node dist/main.js"
    volumes:
      - moshaver_v2_sqlite:/data
    ports:
      - "4000:4000"

  student-v2:
    build:
      context: .
      dockerfile: student-app-v2/Dockerfile
      args:
        VITE_API_URL: /api/v2
    container_name: moshaver-student-v2
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend-v2:4000
    ports:
      - "8080:80"
    depends_on:
      - backend-v2

  admin-v2:
    build:
      context: .
      dockerfile: admin-v2/Dockerfile
      args:
        VITE_API_URL: /api/v2
    container_name: moshaver-admin-v2
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend-v2:4000
    ports:
      - "8081:80"
    depends_on:
      - backend-v2

volumes:
  moshaver_v2_sqlite:
